<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KABOSSES - Accueil</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white font-sans overflow-x-hidden">

    <div id="containerBtn" class="fixed top-6 right-6 z-[100] transition-opacity duration-300">
        <button onclick="toggleMenu(event)" class="group flex items-center space-x-3 bg-black/60 backdrop-blur-md border border-[#b45309]/50 p-3 px-5 rounded-full hover:border-[#b45309]">
            <span class="text-[10px] uppercase tracking-[0.3em]">Menu</span>
            <div class="space-y-1.5">
                <span class="block w-6 h-0.5 bg-[#b45309]"></span>
                <span class="block w-4 h-0.5 bg-white group-hover:w-6 transition-all"></span>
            </div>
        </button>
    </div>

    <div id="menuOverlay" 
         onmouseleave="closeMenu()" 
         class="fixed top-0 left-0 w-full h-[10vh] bg-[#0a0a0a]/95 backdrop-blur-md border-b border-[#b45309]/30 z-[90] transform -translate-y-full transition-transform duration-500 ease-out flex items-center justify-center">
        
        <nav class="flex items-center justify-center gap-6 md:gap-16 px-6 w-full">
            <a href="index.html" class="text-[10px] md:text-[11px] uppercase tracking-[0.3em] font-light text-[#b45309] font-bold">Accueil</a>
            <a href="viewer.html" class="text-[10px] md:text-[11px] uppercase tracking-[0.3em] font-light text-gray-300 hover:text-[#b45309] transition-colors">Galerie</a>
            <a href="artiste.html" class="text-[10px] md:text-[11px] uppercase tracking-[0.3em] font-light text-gray-300 hover:text-[#b45309] transition-colors">L'Artiste</a>
            <a href="contact.html" class="text-[10px] md:text-[11px] uppercase tracking-[0.4em] font-light text-gray-300 hover:text-[#b45309] transition-colors">Contact</a>
        </nav>
    </div>

    <main class="relative h-screen flex flex-col items-center justify-center text-center px-6">
        <div class="absolute inset-0 bg-[url('assets/hero.jpg')] bg-cover bg-center opacity-30 z-0"></div>
        <div class="relative z-10">
            <h1 class="text-5xl md:text-8xl font-black mb-6 tracking-tighter uppercase leading-none">
                L'ART DE LA <br><span class="text-[#b45309]">RÉCUPÉRATION</span>
            </h1>
            <p class="text-gray-400 mb-10 text-[10px] uppercase tracking-[0.5em]">Soudure à la main • Kabosses</p>
            <a href="viewer.html" class="inline-block border border-[#b45309] text-[#b45309] px-10 py-4 font-bold uppercase tracking-widest hover:bg-[#b45309] hover:text-white transition-all">Explorer la galerie</a>
        </div>
    </main>

    <script>
        const menu = document.getElementById('menuOverlay');
        const btn = document.getElementById('containerBtn');

        function toggleMenu(e) {
            if (e) e.stopPropagation();
            menu.classList.remove('-translate-y-full');
            // Cache le bouton pour libérer l'espace visuel des 10%
            if (btn) {
                btn.style.opacity = '0';
                btn.style.pointerEvents = 'none';
            }
        }

        function closeMenu() {
            menu.classList.add('-translate-y-full');
            // Réaffiche le bouton quand le menu se ferme
            if (btn) {
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        }

        // Fermeture de sécurité si on clique en dehors
        document.addEventListener('click', (e) => {
            if (menu && !menu.contains(e.target) && !menu.classList.contains('-translate-y-full')) {
                closeMenu();
            }
        });
    </script>
</body>
</html>
