<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KABOSSES - Accueil</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Correction immédiate du scroll et du menu pour l'index */
        html, body {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh !important;
        }
        @media (max-width: 768px) {
            #nav-links-container { flex-direction: column !important; gap: 2.5rem !important; }
            #menuOverlay { height: 100vh !important; }
        }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white font-sans selection:bg-[#b45309]">

    <div id="containerBtn" class="fixed top-6 right-6 z-[100]">
        <button onclick="toggleMenu(event)" class="group flex items-center space-x-3 bg-black/60 backdrop-blur-md border border-[#b45309]/50 p-3 px-5 rounded-full hover:border-[#b45309] transition-all">
            <span class="text-[10px] uppercase tracking-[0.3em]">Menu</span>
            <div class="space-y-1.5">
                <span class="block w-6 h-0.5 bg-[#b45309]"></span>
                <span class="block w-4 h-0.5 bg-white group-hover:w-6 transition-all"></span>
            </div>
        </button>
    </div>

    <div id="menuOverlay" class="fixed top-0 left-0 w-full z-[90] bg-[#0a0a0a]/98 backdrop-blur-xl transform -translate-y-full transition-transform duration-500 ease-out flex flex-col items-center justify-center">
        <button onclick="closeMenu()" class="absolute top-8 right-8 text-[#b45309] uppercase text-[10px] tracking-widest">Fermer ✕</button>
        <nav id="nav-links-container" class="flex flex-col md:flex-row items-center justify-center gap-12">
            <a href="index.html" class="text-xl uppercase tracking-[0.4em] text-[#b45309] font-bold">Accueil</a>
            <a href="viewer.html" class="text-xl uppercase tracking-[0.4em] font-light text-gray-300 hover:text-[#b45309]">Galerie</a>
            <a href="artiste.html" class="text-xl uppercase tracking-[0.4em] font-light text-gray-300 hover:text-[#b45309]">L'Artiste</a>
            <a href="contact.html" class="text-xl uppercase tracking-[0.4em] font-light text-gray-300 hover:text-[#b45309]">Contact</a>
        </nav>
    </div>

    <main class="relative min-h-screen flex flex-col items-center justify-center text-center px-6">
        <div class="absolute inset-0 bg-[url('assets/hero.jpg')] bg-cover bg-center opacity-20 z-0"></div>
        <div class="relative z-10">
            <h1 class="text-5xl md:text-8xl font-black mb-6 tracking-tighter leading-none uppercase">
                L'ART NÉ DE LA <br>
                <span class="text-[#b45309]">RÉCUPÉRATION</span>
            </h1>
            <p class="text-gray-400 mb-10 text-[10px] md:text-sm uppercase tracking-[0.5em]">Soudure à la main • Métaux Oubliés • Kabosses</p>
            <a href="viewer.html" class="inline-block border-2 border-[#b45309] text-[#b45309] px-10 py-4 font-bold uppercase tracking-widest hover:bg-[#b45309] hover:text-white transition-all">Explorer la galerie</a>
        </div>
    </main>

    <script>
        const menu = document.getElementById('menuOverlay');
        const btn = document.getElementById('containerBtn');
        function toggleMenu(e) {
            e.stopPropagation();
            menu.classList.remove('-translate-y-full');
            menu.classList.add('translate-y-0');
            btn.style.opacity = '0';
            btn.style.pointerEvents = 'none';
        }
        function closeMenu() {
            menu.classList.remove('translate-y-0');
            menu.classList.add('-translate-y-full');
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'auto';
        }
        document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && !menu.classList.contains('-translate-y-full')) closeMenu();
        });
    </script>
</body>
</html>
