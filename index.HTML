<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KABOSSES - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Force le scroll vertical sur tous les navigateurs */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
            overflow-y: auto !important; /* Autorise le scroll */
            height: auto !important;     /* Empêche de bloquer la hauteur */
            min-height: 100vh !important;
            background-color: #0a0a0a !important;
        }

        /* Force le menu mobile en colonne */
        @media (max-width: 768px) {
            #mobile-nav-links {
                flex-direction: column !important;
                gap: 2.5rem !important;
            }
            #menuOverlay {
                height: 100vh !important; /* Plein écran sur mobile pour éviter les bugs */
            }
        }
    </style>
</head>
<body class="text-white font-sans">

    <div id="containerBtn" class="fixed top-6 right-6 z-[100]">
        <button onclick="toggleMenu(event)" class="flex items-center space-x-3 bg-black/80 backdrop-blur-md border border-[#b45309] p-3 px-5 rounded-full shadow-lg">
            <span class="text-[10px] uppercase tracking-[0.3em]">Menu</span>
            <div class="space-y-1.5">
                <span class="block w-6 h-0.5 bg-[#b45309]"></span>
                <span class="block w-6 h-0.5 bg-white"></span>
            </div>
        </button>
    </div>

    <div id="menuOverlay" class="fixed top-0 left-0 w-full z-[90] bg-[#0a0a0a] transform -translate-y-full transition-transform duration-500 ease-in-out flex flex-col items-center justify-center">
        <button onclick="closeMenu()" class="absolute top-8 right-8 text-[#b45309] text-xs tracking-widest uppercase font-bold">Fermer ✕</button>
        
        <nav id="mobile-nav-links" class="flex flex-col md:flex-row items-center justify-center gap-12">
            <a href="index.html" class="text-2xl md:text-xl uppercase tracking-[0.3em] text-[#b45309] font-bold">Accueil</a>
            <a href="viewer.html" class="text-2xl md:text-xl uppercase tracking-[0.3em] hover:text-[#b45309] transition">Galerie</a>
            <a href="artiste.html" class="text-2xl md:text-xl uppercase tracking-[0.3em] hover:text-[#b45309] transition">L'Artiste</a>
            <a href="#" class="text-2xl md:text-xl uppercase tracking-[0.3em] hover:text-[#b45309] transition">Contact</a>
        </nav>
    </div>

    <main class="min-h-screen flex flex-col items-center justify-center text-center p-6 bg-[url('assets/hero.jpg')] bg-cover bg-center bg-fixed bg-no-repeat">
        <div class="absolute inset-0 bg-black/60 z-0"></div>

        <div class="relative z-10">
            <h1 class="text-5xl md:text-8xl font-black mb-6 tracking-tighter leading-none uppercase">
                L'ART NÉ DE LA <br>
                <span class="text-[#b45309]">RÉCUPÉRATION</span>
            </h1>
            <p class="text-gray-300 mb-10 text-xs md:text-sm uppercase tracking-[0.5em]">
                Soudure à la main • Pièces Uniques
            </p>
            <a href="viewer.html" class="inline-block border-2 border-[#b45309] text-[#b45309] px-10 py-4 font-bold uppercase tracking-widest hover:bg-[#b45309] hover:text-white transition-all">
                Explorer la galerie
            </a>
        </div>
    </main>

    <script>
        const menu = document.getElementById('menuOverlay');
        const btn = document.getElementById('containerBtn');

        function toggleMenu(e) {
            e.stopPropagation();
            menu.classList.remove('-translate-y-full');
            menu.classList.add('translate-y-0');
            btn.style.opacity = '0';
            btn.style.pointerEvents = 'none';
        }

        function closeMenu() {
            menu.classList.remove('translate-y-0');
            menu.classList.add('-translate-y-full');
            btn.style.opacity = '1';
            btn.style.pointerEvents = 'auto';
        }

        // Fermer si on clique sur un lien
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', closeMenu);
        });
    </script>
</body>
</html>
