<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KABOSSES - Galerie</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-white font-sans overflow-y-auto min-h-screen selection:bg-[#b45309]">

    <div id="containerBtn" class="fixed top-6 right-6 z-[100] transition-opacity duration-300">
        <button onclick="toggleMenu(event)" class="group flex items-center space-x-3 bg-black/60 backdrop-blur-md border border-[#b45309]/50 p-3 px-5 rounded-full hover:border-[#b45309] active:scale-95 transition-all">
            <span class="text-[10px] uppercase tracking-[0.3em] text-white">Menu</span>
            <div class="space-y-1.5">
                <span class="block w-6 h-0.5 bg-[#b45309]"></span>
                <span class="block w-4 h-0.5 bg-white group-hover:w-6 transition-all"></span>
            </div>
        </button>
    </div>

    <div id="menuOverlay" 
         onmouseleave="closeMenu()" 
         class="fixed top-0 left-0 w-full h-[40vh] bg-[#0a0a0a]/98 backdrop-blur-xl border-b border-[#b45309]/20 z-[90] transform -translate-y-full transition-transform duration-500 ease-out flex flex-col items-center justify-center">
        
        <nav class="flex flex-col md:flex-row items-center justify-center gap-8 md:gap-16 px-6">
            <a href="index.html" class="text-[12px] uppercase tracking-[0.4em] font-light text-gray-300 hover:text-[#b45309] transition">Accueil</a>
            <a href="viewer.html" class="text-[12px] uppercase tracking-[0.4em] font-light text-[#b45309] transition">Galerie</a>
            <a href="artiste.html" class="text-[12px] uppercase tracking-[0.4em] font-light text-gray-300 hover:text-[#b45309] transition">L'Artiste</a>
            <a href="#" class="text-[12px] uppercase tracking-[0.4em] font-light text-gray-300 hover:text-[#b45309] transition">Contact</a>
        </nav>
        <div class="mt-12 text-[9px] uppercase tracking-[0.5em] text-gray-600">
            Kabosses • Sculptures Métalliques
        </div>
    </div>

    <nav class="p-8 flex justify-between items-center border-b border-white/10 backdrop-blur-md sticky top-0 z-50 bg-[#0a0a0a]/80">
        <a href="index.html" class="font-bold text-2xl tracking-tighter text-[#b45309] uppercase">Kabosses</a>
        <a href="index.html" class="text-gray-500 hover:text-white uppercase text-[10px] tracking-[0.3em] transition">← Retour</a>
    </nav>

    <main class="max-w-7xl mx-auto p-12">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-16">
            
            <div class="group">
                <div class="overflow-hidden bg-[#1a1a1a] mb-6 border border-white/5 relative">
                    <img src="assets/1.jpg" alt="Le Veilleur" class="w-full h-96 object-cover grayscale group-hover:grayscale-0 transition duration-700 scale-105 group-hover:scale-100">
                </div>
                <h3 class="text-sm font-bold uppercase tracking-[0.2em] mb-2">Le Veilleur</h3>
                <a href="produit1.html" class="text-[#b45309] text-[10px] uppercase font-bold tracking-[0.3em] border-b border-[#b45309]/30 pb-1 hover:border-[#b45309] transition">Consulter l'œuvre</a>
            </div>

            <div class="group">
                <div class="overflow-hidden bg-[#1a1a1a] mb-6 border border-white/5 opacity-40">
                    <img src="assets/2.jpg" alt="L'Envol" class="w-full h-96 object-cover grayscale">
                </div>
                <h3 class="text-sm font-bold uppercase tracking-[0.2em] mb-2 text-gray-600">L'Envol</h3>
                <span class="text-gray-700 text-[10px] uppercase font-bold tracking-[0.3em]">En cours de création...</span>
            </div>

            <div class="group">
                <div class="overflow-hidden bg-[#1a1a1a] mb-6 border border-white/5 opacity-40">
                    <img src="assets/3.jpg" alt="Résilience" class="w-full h-96 object-cover grayscale">
                </div>
                <h3 class="text-sm font-bold uppercase tracking-[0.2em] mb-2 text-gray-600">Résilience</h3>
                <span class="text-gray-700 text-[10px] uppercase font-bold tracking-[0.3em]">En cours de création...</span>
            </div>

        </div>
    </main>

    <footer class="py-12 flex flex-col items-center justify-center border-t border-white/5 mt-20">
        <div class="text-[10px] uppercase tracking-[0.5em] text-gray-500">
            Kabosses • Sculpture Métallique • 2026
        </div>
    </footer>

    <script>
        const menu = document.getElementById('menuOverlay');
        const containerBtn = document.getElementById('containerBtn');

        function toggleMenu(event) {
            event.stopPropagation();
            menu.classList.remove('-translate-y-full');
            menu.classList.add('translate-y-0');
            containerBtn.classList.add('opacity-0', 'pointer-events-none');
        }

        function closeMenu() {
            menu.classList.remove('translate-y-0');
            menu.classList.add('-translate-y-full');
            containerBtn.classList.remove('opacity-0', 'pointer-events-none');
        }

        document.addEventListener('click', (e) => {
            if (!menu.contains(e.target) && !menu.classList.contains('-translate-y-full')) {
                closeMenu();
            }
        });
    </script>
</body>
</html>
